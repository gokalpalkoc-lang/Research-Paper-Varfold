# Target definition for the research engine.
# All residue numbers are UniProt canonical numbering (P10275-1, 920 aa).
# Note: much of the AR literature uses an older 919/910-residue numbering
# (e.g. "T877A" in papers is T878A here). Always compare via UniProt numbering.

name: ar_lbd
title: Androgen receptor — ligand-binding domain
gene: AR
uniprot: P10275

# The region that is actually folded. 669–919 covers the UniProt "NR LBD"
# domain and matches the crystallised constructs (e.g. PDB 2AM9).
construct:
  start: 669
  end: 919

# Experimental structure used to validate the wild-type prediction.
# Residue mapping to UniProt is taken from SIFTS (PDBe), never assumed.
reference_structure:
  pdb_id: 2AM9
  chain: A

variants:
  # Classes to fold. Unlabelled variants are only used by the scan.
  #   cancer      pathogenic only for cancers (AR's prostate-cancer resistance
  #               mutations, mostly gain-of-function): analysed apart from the
  #               germline pathogenic class, as a negative control
  #   population  clinically unclassified, but carried by people in gnomAD
  #               (see population: below): extra negatives for a secondary analysis
  include_classes: [pathogenic, benign, vus, conflicting, cancer, population]
  # ClinVar-style review stars; 0 keeps everything (incl. UniProt-curated
  # literature variants that carry no ClinVar review status).
  min_review_stars: 0
  # Systematic in-silico mutagenesis on top of the clinical set:
  #   none        clinical variants only (~430 structures)
  #   alanine     every residue -> Ala (~250 extra structures)
  #   saturation  all 19 substitutions at every residue (~4,770 structures;
  #               GPU overnight job, not practical on CPU)
  scan: none

# Population-tolerated negatives. AR is X-linked, so a carrier is a hemizygous XY
# person: a variant that makes the receptor fail completely would not be seen in
# them. Mild (partial) androgen insensitivity is compatible with a male phenotype,
# though, and 15 ClinVar-pathogenic LBD variants do appear in hemizygous carriers;
# clinical labels therefore always win over this rule.
population:
  dataset: gnomad_r4
  count: ac_hemi
  min_carriers: 1

folding:
  model: facebook/esmfold_v1
  num_recycles: 4
  # Trunk chunking trades speed for memory; 64 fits ~250 aa in 8 GB VRAM.
  chunk_size: 64
  # cpu-lm keeps the 3B ESM-2 language model on the CPU in fp32 and runs only the
  # folding trunk on the GPU (~3 GB): this laptop's RTX 5070 exposes 7.5 GB, and
  # fp16 (language model in half precision on the GPU, ~8.4 GB) does not fit it.
  # fp16 runs the ESM-2 language model in half precision on GPUs with more memory;
  # the folding trunk always stays fp32.
  precision: cpu-lm
  device: auto      # auto | cuda | cpu
  save_pae: true

llr:
  # Zero-shot sequence baseline (ESM-2 masked marginals) to compare against.
  model: facebook/esm2_t33_650M_UR50D
  context: full     # full-length protein or just the construct

analysis:
  local_window: 5           # +/- residues around the mutation site
  # A variant is a "breaking point" when its local ΔpLDDT is lower than expected
  # from the noise floor (ΔpLDDT measured >15 Å from the mutation), BH-FDR < this.
  breaking_point_fdr: 0.05
  bootstrap: 2000          # stratified bootstrap resamples for AUC CIs
  permutations: 5000       # paired permutation test for metric-vs-baseline ΔAUC
  seed: 20261025
