# The VarFold demo on the shared Hetzner server (see README › Deploying to devtga.com).
#
# Run from /home/YZ/varfold (scripts/deploy.sh does this):
#   docker compose -p varfold -f app/deploy/docker-compose.yml --env-file .env up -d --build
#
# The server's Caddy belongs to the "scout" project and owns ports 80/443, so this
# file has no Caddy of its own: the app joins scout's network as "varfold-app" and
# deploy/Caddyfile.varfold is appended to scout's Caddyfile. The service is not
# called "app" because Operon's already is, and service names are DNS names on
# that shared network.
#
# The server only reads a precomputed SQLite bundle: no PyTorch, no model, no
# folding. The limits below make sure it can never starve the other sites.

services:
  varfold:
    build: ../web
    restart: unless-stopped
    env_file: ../../.env
    environment:
      VARFOLD_DB: /data/varfold.sqlite
    volumes:
      # scripts/publish.sh swaps the bundle in this folder, then restarts the app.
      - ../../data:/data:ro
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      edge:
        aliases: [varfold-app]

networks:
  edge:
    external: true
    name: deploy_default
